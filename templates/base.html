<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Smart Resume Analyzer{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <a href="{{ url_for('index') }}" class="brand">
            <span class="brand-mark">SR</span>
            <span class="brand-text">Smart Resume Analyzer</span>
        </a>
        <nav class="nav-links">
            <a href="{{ url_for('index') }}" class="{% if request.path == '/' %}active{% endif %}">Analyze</a>
            <a href="{{ url_for('history') }}" class="{% if request.path == '/history' %}active{% endif %}">History</a>
        </nav>
    </div>
</header>

<main class="page">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash-stack">
                {% for message in messages %}
                    <div class="flash-msg">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <p>Smart Resume Analyzer &mdash; College Mini Project</p>
</footer>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
